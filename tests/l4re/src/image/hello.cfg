-- vim:ft=lua

local L4 = require("L4");

local progs = {
  { "hello-c",          "c"       },
  { "hello-cpp",        "c++"     },
  { "hello-c-static",   "c-st"    },
  { "hello-cpp-static", "c++-st"  },
};

for _, p in ipairs(progs) do
  L4.default_loader:start({ log = { p[2], "green" } }, "rom/" .. p[1]):wait();
end

print("All hello programs finished.");
