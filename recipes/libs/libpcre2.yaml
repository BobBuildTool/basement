inherit: [autotools]

metaEnvironment:
    PKG_VERSION: "10.49"
    PKG_LICENSE: "BSD-3-Clause WITH PCRE2-exception"

checkoutSCM:
    scm: url
    url: ${GITHUB_MIRROR}/PCRE2Project/pcre2/releases/download/pcre2-${PKG_VERSION}/pcre2-${PKG_VERSION}.tar.bz2
    digestSHA256: 53c156e1ba416a20da8e65395daa132da0d80e76910424caca3fcdae7831d384
    stripComponents: 1

buildScript: |
    autotoolsBuild $1 \
        --enable-jit \
        --enable-pcre2-8 \
        --enable-pcre2-16 \
        --disable-pcre2grep-libz \
        --disable-pcre2grep-libbz2 \
        --disable-pcre2test-libedit \
        --disable-pcre2test-libreadline

multiPackage:
    "":
        depends:
            - name: libs::libpcre2-tgt
              use: []
        packageScript: autotoolsPackageBin
        provideDeps: [ "*-tgt" ]
    dev:
        packageScript: |
            autotoolsPackageDev
            # install pcre2-config and fix it for bob usage
            mkdir -p usr/bin
            sed 's,prefix=/usr,prefix=$(dirname $0)/..,' $1/install/usr/bin/pcre2-config > usr/bin/pcre2-config
            chmod a+x usr/bin/pcre2-config
    tgt:
        packageScript: autotoolsPackageTgt
