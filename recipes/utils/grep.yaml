inherit: [autotools]

depends:
    - libs::pcre-lib-1-dev
    - use: []
      depends:
          - libs::pcre-lib-1-tgt

metaEnvironment:
    PKG_VERSION: "3.11"
    PKG_LICENSE: "GPL-3.0-or-later"

checkoutSCM:
    scm: url
    url: ${GNU_MIRROR}/grep/grep-${PKG_VERSION}.tar.xz
    digestSHA1: "955146a0a4887eca33606e391481bbef37055b86"
    stripComponents: 1

buildVars: [AUTOCONF_HOST]
buildScript: |
    # Only glibc provides the GNU regex API (re_search etc.)
    case "${AUTOCONF_HOST:-}" in
        *-gnu*) REGEX=--without-included-regex ;;
        *)      REGEX=--with-included-regex ;;
    esac
    autotoolsBuild $1 $REGEX

packageScript: |
    autotoolsPackageTgt

provideDeps: [ "*-tgt" ]
