inherit: [autotools]

depends:
    - libs::libpcre2-dev
    - use: []
      depends:
          - libs::libpcre2-tgt

metaEnvironment:
    PKG_VERSION: "3.12"
    PKG_LICENSE: "GPL-3.0-or-later"

checkoutSCM:
    scm: url
    url: ${GNU_MIRROR}/grep/grep-${PKG_VERSION}.tar.xz
    digestSHA256: "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
    stripComponents: 1

buildScript: |
    # Skip tests and gnulib-tests. They are not installed, and gnulib's test
    # helpers do not build on every platform.
    SUBDIRS_OPT="SUBDIRS=po lib doc src"
    autotoolsBuild -o "$SUBDIRS_OPT" -O "$SUBDIRS_OPT" $1 \
        --enable-perl-regexp

packageScript: |
    autotoolsPackageTgt

provideDeps: [ "*-tgt" ]
