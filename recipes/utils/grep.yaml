inherit: [autotools]

depends:
    - libs::pcre-lib-1-dev
    - use: []
      depends:
          - libs::pcre-lib-1-tgt

metaEnvironment:
    PKG_VERSION: "3.12"
    PKG_LICENSE: "GPL-3.0-or-later"

checkoutSCM:
    scm: url
    url: ${GNU_MIRROR}/grep/grep-${PKG_VERSION}.tar.xz
    digestSHA256: "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
    stripComponents: 1

buildScript: |
    autotoolsBuild $1 \
        --without-included-regex

packageScript: |
    autotoolsPackageTgt

provideDeps: [ "*-tgt" ]
